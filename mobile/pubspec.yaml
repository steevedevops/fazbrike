name: fazbrike
description: "Aplicativo móvel do marketplace Fazbrike."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  file_picker: ^10.3.3
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^14.8.1
  google_fonts: ^6.3.2
  image_picker: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^20.1.0
  firebase_auth: ^6.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logos/
    - lib/assets/images/
    - lib/assets/images/categories/
    - lib/assets/images/highlights/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/logos/app_icon_full.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#C45C26"
  adaptive_icon_foreground: "lib/assets/logos/app_icon_foreground.png"
